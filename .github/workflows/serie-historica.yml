name: '[OBSOLETO] Backfill serie histórica (API SQL del MEF)'

# ⚠ OBSOLETO — no usar salvo para pruebas puntuales.
#
# Construía la serie nacional multi-año consultando `datastore_search_sql` de la API
# de datos abiertos del MEF. Ese endpoint SQL fue retirado / hace timeout (>210 s al
# agregar tablas mensuales de ~11M filas), así que este backfill no es confiable.
# La serie histórica oficial se construye hoy fuera de esta API: etl/serie_oficial.py
# (Informes Globales de la Gestión Presupuestaria del MEF) y
# etl/scraper_consulta_amigable.py, publicada en public/data/serie-historica-oficial.json.
#
# Antes el paso de backfill terminaba en `|| true`, de modo que un fallo de la API se
# reportaba como éxito y se commiteaba un avance parcial sin aviso. Ahora un fallo
# hace fallar el job (rojo en Actions) y no se commitea nada.
# Solo se puede lanzar a mano y exige confirmar explícitamente.
on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Escribe OBSOLETO para confirmar que quieres correr este backfill retirado'
        required: true
        default: ''

permissions:
  contents: write

concurrency:
  group: serie-historica
  cancel-in-progress: false

jobs:
  backfill:
    if: inputs.confirmar == 'OBSOLETO'
    runs-on: ubuntu-latest
    timeout-minutes: 330   # ~5.5 h (tope del runner es 6 h)
    steps:
      - run: echo "::warning::Workflow obsoleto (API SQL del MEF retirada). Ver comentario en serie-historica.yml."
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Descubrir tablas mensuales completas (MONTO_GIRADO)
        run: |
          python - <<'PY'
          import urllib.request, urllib.parse, json
          API="https://api.datosabiertos.mef.gob.pe/DatosAbiertos/v1/datastore_search_sql"
          q="SELECT table_name FROM information_schema.columns WHERE column_name='MONTO_GIRADO' AND table_name NOT LIKE '%_tmp'"
          with urllib.request.urlopen(API+"?sql="+urllib.parse.quote(q), timeout=280) as r:
              rows=json.loads(r.read().decode('utf-8','ignore')).get("records",[])
          json.dump([x["table_name"] for x in rows], open("/tmp/girado_tabs.json","w"))
          print("tablas:", len(rows))
          PY
      - name: Backfill (resumible)
        run: python etl/serie_historica.py
      - name: Commit avance
        run: |
          git config user.name "qhaway-bot"
          git config user.email "bot@users.noreply.github.com"
          git add public/data/serie-nacional.json etl/year_tabs.json
          if git diff --staged --quiet; then
            echo "Sin cambios."
          else
            git commit -m "serie histórica: avance backfill ($(date +%Y-%m-%d))"
            git push
          fi
